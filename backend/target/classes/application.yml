server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autosphere}
    username: ${DB_USERNAME:autosphere}
    password: ${DB_PASSWORD:autosphere_local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
app:
  jwt-secret: ${JWT_SECRET:local-development-secret-change-this-to-at-least-32-characters}
  groq-api-key: ${GROQ_API_KEY:}
  groq-model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  cors-origin: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
